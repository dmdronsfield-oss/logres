<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Logres Model Preview</title>
  <meta name="description" content="A swipe-duel sword-fighting game set in Arthurian Britain. Plays in your phone's browser.">
  <meta name="theme-color" content="#1b2c63">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Logres">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="../assets/art/loading.jpg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1410;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }
    #game {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas { display: block; touch-action: none; }
    #safe-probe {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* Loading: the Sacra di San Michele above the clouds, the title in the fog beside it. */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding-left: 48%;
      color: #2a1f14;
      font: 700 38px "Cinzel", Georgia, serif;
      letter-spacing: 0.2em;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.9);
      /* Zoomed out a little and set in its own fog: soft edges wherever the photograph ends. */
      background: linear-gradient(to bottom, #d8d6d2 6%, rgba(216, 214, 210, 0) 16%, rgba(216, 214, 210, 0) 84%, #d8d6d2 94%),
        linear-gradient(to right, #d8d6d2 1%, rgba(216, 214, 210, 0) 9%, rgba(216, 214, 210, 0) 91%, #d8d6d2 99%),
        #d8d6d2 url(../assets/art/loading.jpg) 30% 44% / auto 86% no-repeat;
    }
    @media (orientation: portrait) {
      /* Upright: the whole abbey at the top, fading into fog where the title sits. */
      #loading {
        padding-left: 0; justify-content: flex-end; padding-bottom: 14vh;
        background: linear-gradient(to bottom, #d8d6d2 4%, rgba(216, 214, 210, 0) 13%, rgba(216, 214, 210, 0) 48%, #d8d6d2 60%),
          #d8d6d2 url(../assets/art/loading.jpg) 30% 12% / 250% auto no-repeat;
      }
    }
    #loading .bar { width: min(60vw, 320px); height: 8px; border: 2px solid #7a5a20; border-radius: 6px; padding: 2px; background: rgba(255, 255, 255, 0.35); }
    #loading .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6b4e14, #b88a2c); border-radius: 3px; transition: width 0.25s; }
    #loading .msg { font: 400 15px "Cinzel", Georgia, serif; letter-spacing: 0.08em; color: #3a2c1c; }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #1b2c63;
      color: #f1e3c4;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font: 700 24px "Cinzel", Georgia, serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #rotate svg { width: 120px; height: 120px; animation: turn 2.4s ease-in-out infinite; }
    #rotate small { font-weight: 400; font-size: 15px; opacity: 0.8; }
    @keyframes turn {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    /* The side view has its own portrait layout, so no "turn your phone" wall here. */
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-probe"></div>
  <div id="loading"><div>LOGRES</div><div class="bar"><i></i></div><div class="msg">Preparing the hall…</div></div>
  <script>
    // Loading progress for the models (fraction 0..1, with a line of what's happening).
    window.__loadProgress = (f, msg) => {
      const el = document.getElementById('loading');
      if (!el) return;
      const bar = el.querySelector('.bar i');
      if (bar) bar.style.width = `${Math.round(Math.max(0, Math.min(1, f)) * 100)}%`;
      if (msg) el.querySelector('.msg').textContent = msg;
    };
  </script>
  <div id="rotate" aria-live="polite">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="30" y="8" width="40" height="84" rx="7" fill="#f1e3c4" stroke="#d9a933" stroke-width="4"/>
      <rect x="35" y="18" width="30" height="62" rx="2" fill="#2b4a9b"/>
      <circle cx="50" cy="86" r="3" fill="#2a1d14"/>
      <path d="M44 40 L56 52 M56 40 L44 52" stroke="#d9a933" stroke-width="3"/>
    </svg>
    <div>Turn your phone<br><small>Logres is played in landscape</small></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script>window.LOGRES_MODE = "3d"; window.LOGRES_CAM = "side"; window.LOGRES_MODEL = "quaternius";</script>
  <script type="module" src="../src/main.js"></script>
  <script>
    // Offline support. Skipped on localhost so development always sees fresh files.
    const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    if ('serviceWorker' in navigator && (!isLocal || location.search.includes('sw=1'))) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        // A new release took over: reload once so the page and cache match.
        if (reloaded || !window.__swHadController) return;
        reloaded = true;
        location.reload();
      });
      window.__swHadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('../service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
