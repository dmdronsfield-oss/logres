<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Logres Animation Lab</title>
  <meta name="theme-color" content="#1b2c63">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d9a933; --ink: #2a1d14; --panel: rgba(18, 16, 24, 0.82); --text: #f1e3c4; }
    html, body { margin: 0; height: 100%; background: #151a26; color: var(--text); font: 14px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    .bar { position: fixed; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 6px; background: var(--panel); border: 1px solid rgba(217, 169, 51, 0.5); border-radius: 10px; }
    .bar::-webkit-scrollbar { display: none; }
    #top { top: max(8px, env(safe-area-inset-top)); align-items: center; }
    #moves { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 46px); }
    #scrub { bottom: max(8px, env(safe-area-inset-bottom)); align-items: center; }
    h1 { font: 700 15px "Cinzel", Georgia, serif; color: var(--gold); margin: 0 6px 0 2px; white-space: nowrap; }
    button, select { flex: none; font: 600 13px system-ui, sans-serif; color: var(--text); background: #2a2a38; border: 1px solid #4a4a5e; border-radius: 8px; padding: 8px 11px; min-height: 36px; }
    button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    input[type=range] { flex: 1; min-width: 120px; accent-color: var(--gold); height: 30px; }
    #label { white-space: nowrap; min-width: 140px; color: var(--gold); font-weight: 600; }
    .sep { width: 1px; align-self: stretch; background: #4a4a5e; flex: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar" id="top">
    <h1>Animation Lab</h1>
    <select id="figure" aria-label="Figure"></select>
    <span class="sep"></span>
    <span id="views"></span>
    <span class="sep"></span>
    <span id="speeds"></span>
  </div>
  <div class="bar" id="moves"></div>
  <div class="bar" id="scrub">
    <button id="play" class="on" aria-label="Play or pause">❚❚</button>
    <input id="time" type="range" min="0" max="1000" value="0" aria-label="Scrub">
    <span id="label"></span>
  </div>
  <script type="module" src="../src/lab/Lab.js"></script>
</body>
</html>
